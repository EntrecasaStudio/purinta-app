<svg width="939" height="848" viewBox="0 0 939 848" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes sweat-fall {
    0%   { opacity: 0; transform: translateY(-10px); }
    8%   { opacity: 1; transform: translateY(0px); }
    45%  { opacity: 0.8; transform: translateY(30px); }
    60%  { opacity: 0; transform: translateY(45px); }
    100% { opacity: 0; transform: translateY(45px); }
  }
  @keyframes tremble {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-1.5px, 0.5px); }
    40% { transform: translate(1px, -0.5px); }
    60% { transform: translate(-0.5px, -1px); }
    80% { transform: translate(1.5px, 0.5px); }
  }
  @keyframes mouth-wave {
    0% { transform: translateX(0); }
    100% { transform: translateX(-82.68px); }
  }
  .drop-1 { animation: sweat-fall 2.8s ease-in 0.2s infinite; transform-origin: 745px 200px; }
  .drop-2 { animation: sweat-fall 2.8s ease-in 1.2s infinite; transform-origin: 205px 180px; }
  .drop-3 { animation: sweat-fall 3.2s ease-in 0.7s infinite; transform-origin: 117px 310px; }
  .drop-4 { animation: sweat-fall 2.5s ease-in 1.8s infinite; transform-origin: 647px 160px; }
  .eyes { animation: tremble 0.3s ease-in-out infinite; }
  .mouth-inner { animation: mouth-wave 1.2s linear infinite; }
</style>

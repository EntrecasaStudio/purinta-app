<svg width="986" height="848" viewBox="-20 0 1050 848" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /* Head tremble */
  @keyframes head-shake {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(-2px, 0.5px); }
    30% { transform: translate(1.5px, -1px); }
    45% { transform: translate(-1px, 1.5px); }
    60% { transform: translate(2px, -0.5px); }
    75% { transform: translate(-1.5px, -1px); }
    90% { transform: translate(1px, 0.5px); }
  }
  .head-shake { animation: head-shake 0.25s ease-in-out infinite; }

  /* Head flush - gradient pulses redder */
  @keyframes head-flush {
    0%, 100% { stop-color: #FCCBCB; }
    50% { stop-color: #FEAAA4; }
  }
  .flush-stop { animation: head-flush 1.2s ease-in-out infinite; }

  /* Face tremble (eyes + mouth) */
  @keyframes face-tremble {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-1.5px, 0.5px); }
    40% { transform: translate(1px, -1px); }
    60% { transform: translate(-0.5px, -1.5px); }
    80% { transform: translate(1.5px, 0.5px); }
  }
  .face-tremble { animation: face-tremble 0.15s ease-in-out infinite; }

  /* Drops splashing outward — fast expulsion, long pause between cycles */
  @keyframes drop-fly-tl {
    0% { opacity: 0; transform: translate(0, 0); }
    8% { opacity: 1; transform: translate(0, 0); }
    35% { opacity: 0.4; transform: translate(-20px, -14px); }
    45% { opacity: 0; transform: translate(-28px, -20px); }
    100% { opacity: 0; transform: translate(-28px, -20px); }
  }
  @keyframes drop-fly-l {
    0% { opacity: 0; transform: translate(0, 0); }
    8% { opacity: 1; transform: translate(0, 0); }
    35% { opacity: 0.4; transform: translate(-18px, -8px); }
    45% { opacity: 0; transform: translate(-26px, -12px); }
    100% { opacity: 0; transform: translate(-26px, -12px); }
  }
  @keyframes drop-fly-t {
    0% { opacity: 0; transform: translate(0, 0); }
    8% { opacity: 1; transform: translate(0, 0); }
    35% { opacity: 0.4; transform: translate(3px, -20px); }
    45% { opacity: 0; transform: translate(5px, -28px); }
    100% { opacity: 0; transform: translate(5px, -28px); }
  }
  @keyframes drop-fly-r {
    0% { opacity: 0; transform: translate(0, 0); }
    8% { opacity: 1; transform: translate(0, 0); }
    35% { opacity: 0.4; transform: translate(20px, -8px); }
    45% { opacity: 0; transform: translate(28px, -12px); }
    100% { opacity: 0; transform: translate(28px, -12px); }
  }
  @keyframes drop-fly-tr {
    0% { opacity: 0; transform: translate(0, 0); }
    8% { opacity: 1; transform: translate(0, 0); }
    35% { opacity: 0.4; transform: translate(18px, -16px); }
    45% { opacity: 0; transform: translate(26px, -22px); }
    100% { opacity: 0; transform: translate(26px, -22px); }
  }
  .drop-tl { animation: drop-fly-tl 1.8s ease-out 0.1s infinite; transform-origin: 90px 100px; }
  .drop-l { animation: drop-fly-l 2.0s ease-out 0.5s infinite; transform-origin: 215px 310px; }
  .drop-t { animation: drop-fly-t 1.6s ease-out 0.3s infinite; transform-origin: 165px 50px; }
  .drop-r { animation: drop-fly-r 1.9s ease-out 0.7s infinite; transform-origin: 955px 270px; }
  .drop-tr { animation: drop-fly-tr 1.7s ease-out 0.2s infinite; transform-origin: 790px 220px; }
</style>

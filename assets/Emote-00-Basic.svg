<style>
  /* Bill printing animation - prints out, pauses, sucks back in */
  @keyframes bill-print {
    0% { transform: translateY(-250px); }
    30% { transform: translateY(0); }
    55% { transform: translateY(0); }
    75% { transform: translateY(-250px); }
    100% { transform: translateY(-250px); }
  }
  .bill-slide {
    animation: bill-print 4s ease-in-out infinite;
  }
</style>

<style>
  @keyframes cheek-breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.3); }
  }
  .cheek-l { animation: cheek-breathe 3s ease-in-out infinite; transform-origin: 274px 452px; }
  .cheek-r { animation: cheek-breathe 3s ease-in-out 0.3s infinite; transform-origin: 693px 452px; }
  @keyframes star-appear {
    0% { opacity: 0; transform: scale(0) rotate(-45deg); }
    40% { opacity: 1; transform: scale(1.15) rotate(10deg); }
    60% { opacity: 1; transform: scale(0.9) rotate(-5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes star-pulse {
    0% { opacity: 0; transform: scale(0.5); }
    30% { opacity: 1; transform: scale(1); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.5); }
  }
  .star-big-r { opacity: 0; animation: star-appear 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards, star-pulse 2.5s ease-in-out 1s infinite; transform-origin: 857px 83px; }
  .star-big-l { opacity: 0; animation: star-appear 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, star-pulse 2.5s ease-in-out 1.3s infinite; transform-origin: 108px 88px; }
  .star-sm-bl { opacity: 0; animation: star-appear 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards, star-pulse 2s ease-in-out 1.7s infinite; transform-origin: 47px 230px; }
  .star-sm-r { opacity: 0; animation: star-appear 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards, star-pulse 2s ease-in-out 1.2s infinite; transform-origin: 938px 195px; }
</style>
